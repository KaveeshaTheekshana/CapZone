    // ⚡ Clean URL Engine: Strips .html from browser address bar
    (function cleanBrowserUrl() {
      try {
        if (window.history && window.history.replaceState && window.location.pathname.endsWith('.html')) {
          let cleanPath = window.location.pathname.replace(/\.html$/i, '');
          if (cleanPath === '/index') cleanPath = '/';
          const newUrl = cleanPath + window.location.search + window.location.hash;
          window.history.replaceState(null, document.title, newUrl);
        }
      } catch(e) {}
    })();

    // 🛡️ Live Server Auto-Refresh Loop Shield (Protects port 5500, 5501, 5502 from constant refresh)
    (function () {

      if (port === '5502' || port === '5500' || port === '5501') {
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function (url, protocols) {
            var ws = protocols ? new OriginalWebSocket(url, protocols) : new OriginalWebSocket(url);

  <script>

    window.API_BASE_URL = (function () {
      const proto = window.location.protocol;
      const host = window.location.hostname || '';
      const port = window.location.port || '';

      if ((host === 'localhost' || host === '127.0.0.1') && port === '6039') {
        return '';
      }

      // If running on local environment (file: or port 5500 Live Server, etc.)
      if (proto === 'file:' || host === 'localhost' || host === '127.0.0.1' || !host) {
        return 'http://localhost:6039';
      }

      // If running on production website domain (capzone.top, etc.)
      if (host.includes('capzone.top') || host.includes('web.app') || host.includes('firebaseapp.com')) {
        return 'https://capzone.kaveez.top';
      }

      if (host.includes('capzone.kaveez.top')) {
        return '';
      }

      return 'https://capzone.kaveez.top';
    })();

    window.formatMediaUrl = function (url) {
      if (!url || typeof url !== 'string') return '';
      if (url.startsWith('blob:') || url.startsWith('data:')) return url;
      let clean = url.trim();
      if (clean.includes('localhost:6039') || clean.includes('127.0.0.1:6039')) {
        clean = clean.replace(/https?:\/\/(localhost|127\.0\.0\.1):6039/gi, API_BASE_URL);
      }
      if (clean.startsWith('/')) {
        clean = `${API_BASE_URL}${clean}`;
      }
      return clean;
    };

    (function enforceHumanVerification() {
      const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const email = localStorage.getItem('capzone_user_email');
      if (!isLocal && !email) {
        window.location.replace('login.html');
      }
    })();

    window.currentUserEmail = (localStorage.getItem('capzone_user_email') || '').toLowerCase().trim();

    const originalFetch = window.fetch ? window.fetch.bind(window) : fetch;
    window.fetch = async function () {
      let [resource, config] = arguments;
      if (typeof resource === 'string' && resource.includes('/api/')) {
        config = config || {};

        if (window.currentUserEmail) {
          if (config.body && config.body instanceof FormData) {
            if (!config.body.has('email')) config.body.append('email', window.currentUserEmail);
          } else if (config.body && typeof config.body === 'string') {
            try {
              let parsed = JSON.parse(config.body);
              if (typeof parsed === 'object' && parsed !== null && !parsed.email) {
                parsed.email = window.currentUserEmail;
                config.body = JSON.stringify(parsed);
              }
            } catch (e) { }
          }
        }

        // Add headers
        config.headers = config.headers || {};
        let customApiKey = localStorage.getItem('capzone_api_type') === 'own' ? (localStorage.getItem('capzone_gemini_key') || '') : '';
        if (config.headers instanceof Headers) {
          if (window.currentUserEmail && !config.headers.has('x-user-email')) config.headers.append('x-user-email', window.currentUserEmail);
          if (customApiKey && !config.headers.has('x-api-key')) config.headers.append('x-api-key', customApiKey);
        } else {
          if (window.currentUserEmail && !config.headers['x-user-email']) config.headers['x-user-email'] = window.currentUserEmail;
          if (customApiKey && !config.headers['x-api-key']) config.headers['x-api-key'] = customApiKey;
        }
      }
      return originalFetch(resource, config);
    };
  </script>

  <script type="module">
    import { auth, onAuthStateChanged, signOut } from './firebase-config.js';

    window.currentUserData = null;

    // 1. Function to update all Dashboard UI elements with live user balance & subscription data
    window.updateUserProfileUI = function (data) {
      if (!data) return;
      const balance = typeof data.balance === 'number' ? data.balance : 0;
      const subType = data.subscription_type || 'none';
      const quotaUsed = data.quota_used || 0;
      const quotaLimit = data.quota_limit || 0;
      const remainingQuota = Math.max(0, quotaLimit - quotaUsed);

      // 0. User Profile Identity (Full Name & Email)
      const uName = data.name || data.displayName || data.username || localStorage.getItem('capzone_user_name') || (data.email ? data.email.split('@')[0] : 'User');
      const uEmail = data.email || window.currentUserEmail || localStorage.getItem('capzone_user_email') || '';

      const profileName = document.getElementById('profileName');
      if (profileName) profileName.textContent = uName;
      const navProfileName = document.getElementById('navProfileName');
      if (navProfileName) navProfileName.textContent = uName;
      const profileEmail = document.getElementById('profileEmail');
      if (profileEmail) profileEmail.textContent = uEmail;
      const profileInitial = document.getElementById('profileInitial');
      if (profileInitial) profileInitial.textContent = uName.charAt(0).toUpperCase();

      // 1. Header live wallet badge (Desktop & Mobile)
      const navWalletText = document.getElementById('navWalletText');
      if (navWalletText) navWalletText.innerText = `Rs. ${balance.toFixed(2)}`;
      const navWalletTextMobile = document.getElementById('navWalletTextMobile');
      if (navWalletTextMobile) navWalletTextMobile.innerText = `Rs. ${balance.toFixed(0)}`;

      const navPlanTag = document.getElementById('navPlanTag');
      if (navPlanTag) {
        if (subType === 'creator') {
          navPlanTag.innerText = `Creator (${remainingQuota}m left)`;

          navPlanTag.innerText = `Pro (${remainingQuota}m left)`;
          navPlanTag.className = "hidden md:inline-block text-[9px] bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 px-1.5 py-0.5 rounded-full uppercase ml-1 font-bold";
        } else if (subType === 'payg') {
          navPlanTag.innerText = 'Pay As You Go';
          navPlanTag.className = "hidden md:inline-block text-[9px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-1.5 py-0.5 rounded-full uppercase ml-1 font-bold";

          navPlanTag.innerText = 'Free (Own API)';
          navPlanTag.className = "hidden md:inline-block text-[9px] bg-slate-700/50 text-slate-400 border border-slate-600 px-1.5 py-0.5 rounded-full uppercase ml-1 font-bold";

      // Header Status Badge (when deactivated)
      const headerStatusBadge = document.getElementById('headerStatusBadge');

          headerStatusBadge.classList.remove('hidden');
          headerStatusBadge.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-black uppercase bg-red-500/20 text-red-400 border border-red-500/30 shadow-[0_0_12px_rgba(239,68,68,0.25)] animate-pulse";
          headerStatusBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-red-400"></span> Deactivated`;
        }
        if (deactBanner) {
          deactBanner.classList.remove('hidden');
        }
      } else {
        if (headerStatusBadge) {
          headerStatusBadge.classList.add('hidden');
        }
        if (deactBanner) {
          deactBanner.classList.add('hidden');
        }
      }

      // 2. Profile Modal elements
      const profileBalance = document.getElementById('profileBalance');
      if (profileBalance) profileBalance.innerText = balance.toFixed(2);
      const modalCurrentBalance = document.getElementById('modalCurrentBalance');
      if (modalCurrentBalance) modalCurrentBalance.innerText = balance.toFixed(2);

      const profileStatusBadge = document.getElementById('profileStatusBadge');
      if (profileStatusBadge) {
        if (data.active === false) {
          profileStatusBadge.className = "px-2 py-0.5 rounded-full text-[10px] font-bold bg-red-500/20 text-red-400 border border-red-500/30";
          profileStatusBadge.innerText = "Deactivated";
        } else {
          profileStatusBadge.className = "px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
          profileStatusBadge.innerText = "Active";
        }
      }

      const profilePlanBadge = document.getElementById('profilePlanBadge');
      if (profilePlanBadge) {
        if (subType === 'creator') profilePlanBadge.innerHTML = `<span class="px-2.5 py-1 bg-amber-500/20 text-amber-400 border border-amber-500/40 rounded-full font-bold text-xs uppercase tracking-wider">Creator Monthly</span>`;
        else if (subType === 'pro') profilePlanBadge.innerHTML = `<span class="px-2.5 py-1 bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 rounded-full font-bold text-xs uppercase tracking-wider">Pro Monthly</span>`;
        else if (subType === 'payg') profilePlanBadge.innerHTML = `<span class="px-2.5 py-1 bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 rounded-full font-bold text-xs uppercase tracking-wider">Pay As You Go</span>`;
        else profilePlanBadge.innerHTML = `<span class="px-2.5 py-1 bg-slate-700/50 text-slate-300 border border-slate-600 rounded-full font-bold text-xs uppercase tracking-wider">Free (Own API)</span>`;
      }

      const profileMonthlySection = document.getElementById('profileMonthlySection');
      const profilePayPerVideoSection = document.getElementById('profilePayPerVideoSection');
      if (subType === 'creator' || subType === 'pro') {
        if (profileMonthlySection) profileMonthlySection.style.display = 'block';
        if (profilePayPerVideoSection) profilePayPerVideoSection.style.display = 'none';

        const profileQuotaUsed = document.getElementById('profileQuotaUsed');
        if (profileQuotaUsed) profileQuotaUsed.innerText = `${quotaUsed} Mins`;
        const profileQuotaLimit = document.getElementById('profileQuotaLimit');
        if (profileQuotaLimit) profileQuotaLimit.innerText = `${quotaLimit} Mins`;
        const profileQuotaRemaining = document.getElementById('profileQuotaRemaining');
        if (profileQuotaRemaining) profileQuotaRemaining.innerText = `${remainingQuota} Mins Left`;

        const pct = quotaLimit > 0 ? Math.min(100, Math.round((quotaUsed / quotaLimit) * 100)) : 0;
        const profileQuotaBar = document.getElementById('profileQuotaBar');
        if (profileQuotaBar) profileQuotaBar.style.width = `${pct}%`;

        const profileQuotaReset = document.getElementById('profileQuotaReset');
        if (profileQuotaReset && data.quota_reset_date) {
          profileQuotaReset.innerText = new Date(data.quota_reset_date).toLocaleDateString();
        }
      } else {
        if (profileMonthlySection) profileMonthlySection.style.display = 'none';
        if (profilePayPerVideoSection) profilePayPerVideoSection.style.display = 'block';
      }

      const profileSrtCount = document.getElementById('profileSrtCount');
      if (profileSrtCount) profileSrtCount.innerText = data.srt_count || 0;

      // Re-validate video if one is currently selected in SRT modal
      if (window.currentMediaDuration !== undefined && window.currentMediaDuration !== null && typeof validateAndDisplayVideoDetails === 'function') {
        validateAndDisplayVideoDetails(window.currentMediaDuration, currentSrtFile ? currentSrtFile.size : 0);

      if (window.lucide) window.lucide.createIcons();

    // 2. Function to fetch live user profile from server (immune to cache)
    window.fetchUserProfile = async function (email) {
      if (window._isFetchingProfile) return;
      window._isFetchingProfile = true;
      try {
        let uEmail = email || window.currentUserEmail || localStorage.getItem('capzone_user_email');
        if (!uEmail || uEmail === 'creator@capzone.ai' || uEmail === 'creator@capzone.local') {
          return;
        }
        uEmail = uEmail.toLowerCase().trim();
        window.currentUserEmail = uEmail;

        // 1. Instant cache display
        try {
          const cached = localStorage.getItem('capzone_cached_user_' + uEmail) || localStorage.getItem('capzone_user_profile');
          if (cached && !window.currentUserData) {
            const parsed = JSON.parse(cached);
            if (parsed && (parsed.email || '').toLowerCase().trim() === uEmail) {
              window.currentUserData = parsed;
              window.updateUserProfileUI(parsed);
            }
          }
        } catch (e) { }

        // 2. Fetch live data from server
        try {
          const fetchFn = window.originalFetch || window.fetch;
          let res = await fetchFn(`${window.API_BASE_URL || ''}/api/user-info?email=${encodeURIComponent(uEmail)}&_t=${Date.now()}`, {
            cache: 'no-store',
            headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate', 'x-user-email': uEmail }
          }).catch(() => null);


          if (res && (res.status === 403 || res.status === 401)) {
            console.warn("User account deactivated or blacklisted by Admin:", uEmail);
            localStorage.removeItem('capzone_user_email');
            localStorage.removeItem('capzone_user_name');
            localStorage.removeItem('capzone_user_profile');
            localStorage.removeItem('capzone_cached_user_' + uEmail);
            localStorage.removeItem('capzone_projects_' + uEmail);
            localStorage.removeItem('capzone_deleted_keys_' + uEmail);
            localStorage.removeItem('capzone_login_timestamp');
            try { await signOut(auth); } catch (e) { }
            window.location.replace('login.html');
            return;
          }

          if (res && res.status === 404) {
            let body = {};
            try { body = await res.json(); } catch (e) { }
            if (body.deleted === true || body.active === false || !body.email) {
              console.warn("User account removed by Admin:", uEmail);
              localStorage.removeItem('capzone_user_email');
              localStorage.removeItem('capzone_user_name');
              localStorage.removeItem('capzone_user_profile');
              localStorage.removeItem('capzone_cached_user_' + uEmail);
              localStorage.removeItem('capzone_projects_' + uEmail);
              localStorage.removeItem('capzone_deleted_keys_' + uEmail);
              localStorage.removeItem('capzone_login_timestamp');
              try { await signOut(auth); } catch (e) { }
              window.location.replace('login.html');
              return;
            }
          }

          if (res && res.ok) {
            const data = await res.json();
            if (data && (data.active === false || data.deleted === true)) {
              console.warn("User account is inactive or deleted:", uEmail);
              localStorage.removeItem('capzone_user_email');
              localStorage.removeItem('capzone_user_name');
              localStorage.removeItem('capzone_user_profile');
              localStorage.removeItem('capzone_cached_user_' + uEmail);
              try { await signOut(auth); } catch (e) { }
              window.location.replace('login.html');
              return;
            }
            if (data && data.email) {
              const dataStr = JSON.stringify(data);
              const hasChanged = window._lastRenderedUserData !== dataStr;
              window.currentUserData = data;
              localStorage.setItem('capzone_cached_user_' + uEmail, dataStr);
              localStorage.setItem('capzone_user_profile', dataStr);
              if (hasChanged) {
                window._lastRenderedUserData = dataStr;
                window.updateUserProfileUI(data);
              }
            }
          }
        } catch (err) {
          console.warn("Could not fetch user profile info:", err);
        }
      } finally {
        window._isFetchingProfile = false;
      }
    };

    // 3. Setup BroadcastChannel & Storage events for Real-Time synchronization with Admin panel
    try {
      const syncChannel = new BroadcastChannel('capzone_realtime_sync');
      syncChannel.onmessage = (event) => {
        console.log('⚡ Real-time sync update received from Admin:', event.data);
        const curEmail = (window.currentUserEmail || localStorage.getItem('capzone_user_email') || '').toLowerCase().trim();

        if (event.data && event.data.type === 'USER_DELETED') {
          const targetEmail = (event.data.email || '').toLowerCase().trim();
          if (targetEmail === curEmail) {
            localStorage.removeItem('capzone_projects_' + curEmail);
            localStorage.removeItem('capzone_cached_user_' + curEmail);
            if (typeof window.handleLogout === 'function') {
              window.handleLogout();
            } else {
              localStorage.clear();
              window.location.href = 'login.html';
            }
          }
        } else if (event.data && event.data.user) {
          const targetEmail = (event.data.email || event.data.user.email || '').toLowerCase().trim();
          if (!targetEmail || targetEmail === curEmail) {
            window.currentUserData = { ...window.currentUserData, ...event.data.user };
            localStorage.setItem('capzone_cached_user_' + curEmail, JSON.stringify(window.currentUserData));
            window.updateUserProfileUI(window.currentUserData);
          }
        }
        if (typeof window.fetchUserProfile === 'function') {
          window.fetchUserProfile();
        }
      };
    } catch (e) { }

    window.addEventListener('storage', (e) => {
      if (e.key === 'capzone_admin_sync' || e.key === 'capzone_balance_update' || e.key === 'capzone_payment_sync') {
        try {
          const syncData = JSON.parse(e.newValue);
          const curEmail = (window.currentUserEmail || localStorage.getItem('capzone_user_email') || '').toLowerCase().trim();

          if (syncData && syncData.deleted) {
            const targetEmail = (syncData.email || '').toLowerCase().trim();
            if (targetEmail === curEmail) {
              localStorage.removeItem('capzone_projects_' + curEmail);
              localStorage.removeItem('capzone_cached_user_' + curEmail);
              if (typeof window.handleLogout === 'function') {
                window.handleLogout();
              } else {
                localStorage.clear();
                window.location.href = 'login.html';
              }
            }
          } else if (syncData && syncData.user) {
            const targetEmail = (syncData.email || syncData.user.email || '').toLowerCase().trim();
            if (!targetEmail || targetEmail === curEmail) {
              window.currentUserData = { ...window.currentUserData, ...syncData.user };
              localStorage.setItem('capzone_cached_user_' + curEmail, JSON.stringify(window.currentUserData));
              window.updateUserProfileUI(window.currentUserData);
            }
          }
        } catch (err) { }
        if (typeof window.fetchUserProfile === 'function') window.fetchUserProfile();
      }
    });

    window.addEventListener('focus', () => {
      if (typeof window.fetchUserProfile === 'function') window.fetchUserProfile();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && typeof window.fetchUserProfile === 'function') {
