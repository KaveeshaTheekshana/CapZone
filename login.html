<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login - CapZone Video Editor</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Sora:wght@600;700&family=Outfit:wght@800;900&display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-container": "#34007f",
                        "on-error": "#690005",
                        "surface-container-lowest": "#0c0e12",
                        "surface-container-highest": "#333539",
                        "on-surface-variant": "#c1c6d7",
                        "background": "#090a0f",
                        "on-tertiary": "#3c0090",
                        "error": "#ffb4ab",
                        "secondary-container": "#00f1fe",
                        "tertiary-container": "#a178ff",
                        "tertiary-fixed-dim": "#d1bcff",
                        "surface-container": "#1e2024",
                        "primary-fixed": "#d8e2ff",
                        "surface-tint": "#adc6ff",
                        "on-secondary": "#00363a",
                        "surface-container-high": "#282a2e",
                        "primary": "#adc6ff",
                        "secondary-fixed-dim": "#00dbe7",
                        "surface-variant": "#333539",
                        "surface-container-low": "#1a1c20",
                        "on-error-container": "#ffdad6",
                        "secondary-fixed": "#74f5ff",
                        "surface-bright": "#37393e",
                        "secondary": "#ddfcff",
                        "error-container": "#93000a",
                        "surface": "#111317",
                        "tertiary-fixed": "#e9ddff",
                        "outline": "#8b90a0",
                        "primary-fixed-dim": "#adc6ff",
                        "outline-variant": "#414755",
                        "primary-container": "#4b8eff",
                        "on-secondary-container": "#006a70",
                        "inverse-surface": "#e2e2e8",
                        "on-secondary-fixed": "#002022",
                        "surface-dim": "#111317",
                        "on-primary": "#002e69",
                        "inverse-on-surface": "#2f3035",
                        "on-secondary-fixed-variant": "#004f54",
                        "on-tertiary-fixed-variant": "#5700c9",
                        "on-primary-fixed": "#001a41",
                        "tertiary": "#d1bcff",
                        "on-surface": "#e2e2e8",
                        "on-tertiary-fixed": "#23005b",
                        "on-primary-container": "#00285c",
                        "on-background": "#e2e2e8",
                        "on-primary-fixed-variant": "#004493",
                        "inverse-primary": "#005bc1"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "8px",
                        "margin": "24px",
                        "lg": "40px",
                        "sm": "16px",
                        "gutter": "16px",
                        "md": "24px",
                        "base": "4px",
                        "xl": "64px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "headline-md": ["Sora"],
                        "display-lg-mobile": ["Sora"],
                        "display-lg": ["Sora"],
                        "label-mono": ["JetBrains Mono"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-mono": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background-color: rgba(17, 19, 23, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .glass-modal {
            background-color: rgba(17, 19, 23, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .glow-active {
            box-shadow: 0 0 8px rgba(173, 198, 255, 0.5);
        }

        /* CapZone Logo Styles from Dashboard */
        .brand-title-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            color: white;
            margin-bottom: 6px;
        }

        .brand-logo-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #6200ea;
            /* Solid purple */
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(98, 0, 234, 0.6);
        }

        .brand-text {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: white;
            font-family: 'Outfit', sans-serif;
            text-shadow: 0 0 10px rgba(162, 51, 255, 0.8), 0 0 20px rgba(162, 51, 255, 0.4);
        }
    </style>
</head>

<body
    class="bg-background text-on-background font-body-sm min-h-screen relative overflow-y-auto flex flex-col items-center pt-10 pb-24"
    style="background-color: #090a0f;">
    <!-- Background Image & Gradient Overlay -->
    <div class="absolute inset-0 w-full h-full z-0">
        <img src="bg.png" class="w-full h-full object-cover opacity-30" style="object-position: center;"
            alt="Studio Background" onerror="this.style.display='none'" />
        <div class="absolute inset-0 bg-gradient-to-t from-background via-transparent to-transparent"></div>
    </div>

    <!-- Login Card -->
    <div class="rounded-xl w-full max-w-md p-lg z-10 relative mx-4 my-auto"
        style="background-color: #111317; animation: scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);">
        <style>
            @keyframes scaleIn {
                from {
                    transform: scale(0.95);
                    opacity: 0;
                }

                to {
                    transform: scale(1);
                    opacity: 1;
                }
            }
        </style>

        <!-- CapZone Logo -->
        <div class="flex justify-center mb-md mt-xs">
            <div class="brand-logo-icon"
                style="width: 44px; height: 44px; border-radius: 10px; background: #6200ea; display: flex; align-items: center; justify-content: center; box-shadow: none;">
                <span class="material-symbols-outlined" style="font-size: 24px; color: white;">movie_edit</span>
            </div>
        </div>

        <!-- Title -->
        <div class="text-center mb-lg mt-sm">
            <h1 class="font-headline-md text-headline-md text-on-surface mb-xs" style="color: white; font-weight: 700;">
                Welcome Back to CapZone</h1>
            <p class="font-body-sm text-body-sm text-on-surface-variant">Cinematic precision for creators.</p>
        </div>
        <!-- Social Logins -->
        <div class="space-y-sm mb-md">
            <button id="google-login-btn"
                class="w-full flex items-center justify-center gap-sm py-sm px-margin rounded-lg transition-colors text-on-surface font-body-sm text-body-sm font-medium focus:outline-none hover:bg-surface-container-high"
                style="background-color: #1a1c20; border: 1px solid rgba(255,255,255,0.05);">
                <svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        fill="#4285F4"></path>
                    <path
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        fill="#34A853"></path>
                    <path
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                        fill="#FBBC05"></path>
                    <path
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        fill="#EA4335"></path>
                </svg>
                <span style="color: white; font-weight: 600;">Sign in with Google</span>
            </button>
            <button
                class="w-full flex items-center justify-center gap-sm py-sm px-margin rounded-lg transition-colors text-on-surface font-body-sm text-body-sm font-medium focus:outline-none hover:bg-surface-container-high"
                style="background-color: #1a1c20; border: 1px solid rgba(255,255,255,0.05);">
                <span class="material-symbols-outlined" style="color: #a178ff; font-size: 20px;">phone_iphone</span>
                <span style="color: white; font-weight: 600;">Sign in with Phone Number</span>
            </button>
        </div>
        <!-- Divider -->
        <div class="relative flex items-center mb-md mt-md">
            <div class="flex-grow border-t border-outline-variant" style="border-color: rgba(255,255,255,0.1);"></div>
            <span
                class="flex-shrink-0 mx-sm font-label-mono text-label-mono text-on-surface-variant uppercase tracking-widest px-xs rounded"
                style="background: none; font-size: 10px;">OR</span>
            <div class="flex-grow border-t border-outline-variant" style="border-color: rgba(255,255,255,0.1);"></div>
        </div>
        <!-- Email/Password Form -->
        <form id="email-login-form" class="space-y-sm mb-lg">
            <div>
                <label class="sr-only" for="email">Email</label>
                <input
                    class="w-full rounded-lg py-sm px-margin text-on-surface font-body-sm text-body-sm placeholder:text-on-surface-variant focus:outline-none transition-all"
                    id="email" name="email" placeholder="Email address" required="" type="email"
                    style="background-color: #0c0e12; border: 1px solid rgba(255,255,255,0.1); color: white;" />
            </div>
            <div>
                <label class="sr-only" for="password">Password</label>
                <input
                    class="w-full rounded-lg py-sm px-margin text-on-surface font-body-sm text-body-sm placeholder:text-on-surface-variant focus:outline-none transition-all"
                    id="password" name="password" placeholder="Password" required="" type="password"
                    style="background-color: #0c0e12; border: 1px solid rgba(255,255,255,0.1); color: white;" />
            </div>
            <div class="flex items-center justify-between mt-sm">
                <label class="flex items-center gap-xs cursor-pointer">
                    <input
                        class="form-checkbox h-4 w-4 text-primary bg-surface-container-lowest border-outline-variant rounded focus:ring-primary focus:ring-offset-background"
                        type="checkbox" />
                    <span class="font-body-sm text-body-sm text-on-surface-variant">Remember me</span>
                </label>
                <a class="font-body-sm text-body-sm text-primary hover:text-primary-fixed transition-colors" href="#"
                    style="color: #a178ff;">Forgot password?</a>
            </div>
            <button
                class="w-full font-body-sm text-body-sm font-semibold rounded-lg py-sm px-margin mt-md hover:opacity-90 transition-colors focus:outline-none glow-active"
                type="submit" style="background-color: #3b82f6; color: white;">
                Sign In
            </button>
        </form>
        <!-- Sign Up Link -->
        <p class="text-center font-body-sm text-body-sm text-on-surface-variant">
            Don't have an account? <a class="text-primary hover:text-primary-fixed transition-colors font-medium"
                href="#" style="color: #a178ff;">Sign up for free</a>
        </p>
    </div>
    <!-- Footer -->
    <div
        class="absolute bottom-0 w-full z-10 p-md flex flex-col md:flex-row justify-center items-center gap-sm font-body-sm text-body-sm text-on-surface-variant opacity-70">
        <span>© 2026 CapZone Video Editor.</span>
        <div class="flex gap-md">
            <a class="hover:text-on-surface transition-colors" href="#">Privacy Policy</a>
            <a class="hover:text-on-surface transition-colors" href="#">Terms of Service</a>
            <a class="hover:text-on-surface transition-colors" href="#">Cookies</a>
        </div>
    </div>

    <!-- Firebase Authentication Logic -->
    <script type="module">
        import { auth, googleProvider, signInWithPopup, signInWithEmailAndPassword, onAuthStateChanged } from './firebase-config.js';

        // Redirect if already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'dashboard.html';
            }
        });

        // Google Sign-In
        document.getElementById('google-login-btn').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, googleProvider);
                // onAuthStateChanged will redirect automatically
            } catch (error) {
                console.error("Google Sign-In Error:", error);
                alert("Google Login Failed: " + error.message);
            }
        });

        // Email/Password Sign-In
        document.getElementById('email-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = "Signing in...";
            btn.disabled = true;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // onAuthStateChanged will redirect automatically
            } catch (error) {
                console.error("Email Login Error:", error);
                alert("Login Failed: " + error.message);
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
