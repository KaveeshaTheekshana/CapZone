<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeCut Pro Editor - CineNexus</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase Auth Protection -->
  <script type="module">
    import { auth, onAuthStateChanged } from './firebase-config.js';
    onAuthStateChanged(auth, (user) => {
        if (!user) {
            window.location.href = 'login.html';
        }
    });
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: #0f172a;
    }
    .glass-nav {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    #freecut-iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body class="text-slate-100 font-sans">
  
  <!-- Top Navigation -->
  <nav class="glass-nav px-4 py-2.5 flex items-center justify-between shrink-0 h-14">
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 hover:text-white transition-colors flex items-center gap-2">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span class="text-xs font-bold hidden sm:inline">Back to Dashboard</span>
      </a>
      <div class="h-5 w-px bg-slate-700 hidden sm:block"></div>
      <div class="flex items-center gap-2">
        <div class="p-1.5 bg-gradient-to-tr from-pink-500 to-orange-400 text-white rounded-lg shadow-lg">
          <i data-lucide="video" class="w-4 h-4"></i>
        </div>
        <div>
          <span class="text-sm font-black tracking-wide">Pro Editor</span>
          <span class="text-[9px] text-pink-400 font-bold block -mt-1 uppercase tracking-widest">Powered by FreeCut</span>
        </div>
      </div>
    </div>
    
    <div class="flex items-center gap-2">
      <div class="px-3 py-1 bg-green-500/10 border border-green-500/20 text-green-400 rounded-full text-[10px] font-bold flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
        WebGPU Active
      </div>
    </div>
  </nav>

  <!-- Editor Iframe -->
  <div class="flex-1 w-full h-full relative bg-black">
    <iframe id="freecut-iframe" src="https://freecut.net/" allow="camera; microphone; display-capture; autoplay; cross-origin-isolated"></iframe>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
